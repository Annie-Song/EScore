# 三服务编排：主应用 + 向量嵌入微服务 + OCR 微服务。
# 前置（首次构建前）：python scripts/prepare_docker_models.py
#   从宿主机模型缓存拷入 docker/models/（hf-mirror.com 在本机被墙，构建期不可联网下载模型）
# 启动：docker compose up -d   访问 http://localhost:5000
# 关闭：docker compose down    （bind mount 保留 output/uploads 数据）
# GPU 预留：docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   （需先把镜像换成 paddlepaddle-gpu 基础版，见 docker-compose.gpu.yml 注释）
name: grade-homework

services:
  embedding:
    build: { context: ., dockerfile: docker/Dockerfile, target: embedding }
    container_name: grade-embedding
    init: true
    restart: unless-stopped
    environment:
      EMBEDDING_SERVICE_HOST: "0.0.0.0"   # 覆盖 config.py 默认 127.0.0.1，容器内须绑非回环口
      EMBEDDING_SERVICE_PORT: "8765"
      HF_HUB_OFFLINE: "1"                 # 模型已进镜像，禁止向被墙的 huggingface.co 发探测
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=120).read()"]
      interval: 10s
      timeout: 120s
      start_period: 30s
      retries: 6
    networks: [grade-net]

  ocr:
    build: { context: ., dockerfile: docker/Dockerfile, target: ocr }
    container_name: grade-ocr
    init: true
    restart: unless-stopped
    environment:
      OCR_SERVICE_HOST: "0.0.0.0"
      OCR_SERVICE_PORT: "8766"
      OCR_DEVICE: "${OCR_DEVICE:-cpu}"
      OCR_CPU_THREADS: "${OCR_CPU_THREADS:-4}"
    volumes:
      - ./output:/app/output              # enhance/segments 落宿主
      - ./uploads:/app/uploads:ro         # OCR 按 HTTP 传的文件路径读图（在自身 CWD 下解析）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/ready', timeout=180).read()"]
      interval: 15s
      timeout: 180s
      start_period: 60s
      retries: 8
    networks: [grade-net]

  app:
    build: { context: ., dockerfile: docker/Dockerfile, target: app }
    container_name: grade-app
    init: true
    env_file:
      - path: .env                        # DEEPSEEK_API_KEY / SECRET_KEY / ALIPAY_* 等
        required: false                   # 缺 .env 仅影响对应能力，不阻断启动
    environment:
      FLASK_HOST: "0.0.0.0"               # 覆盖 run.py 默认 127.0.0.1
      EMBEDDING_SERVICE_URL: "http://embedding:8765"   # 覆盖 .env 默认 127.0.0.1
      OCR_SERVICE_URL: "http://ocr:8766"
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output              # DB/报告落宿主，零数据迁移
      - ./uploads:/app/uploads
    depends_on:
      embedding: { condition: service_healthy }
      ocr: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks: [grade-net]

networks:
  grade-net:
    driver: bridge
