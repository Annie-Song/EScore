{% extends "base.html" %}

{% block title %}登录/注册 - 智能作业批改系统{% endblock %}

{% block styles %}
<style>
  /* 登录/注册页专属样式：居中卡片、双 tab 切换 */
  .auth-card {
    max-width: 460px;
    margin: 40px auto;
  }

  .auth-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .auth-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    background: var(--light-bg);
    color: var(--light-text);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    cursor: pointer;
    font-weight: 500;
    font-size: 15px;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }

  .auth-tab.active {
    background: var(--primary-color);
    color: #fff;
    border-color: var(--primary-color);
  }

  .auth-form {
    display: none;
  }

  .auth-form.active {
    display: block;
  }

  .auth-submit {
    width: 100%;
    margin-top: 6px;
  }
</style>
{% endblock %}

{% block content %}
  <div class="container auth-card">
    <div class="page-header">
      <h1>登录 / 注册</h1>
      <p>登录后可同步个人批改记录与收藏</p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="loginTab">登录</button>
      <button type="button" class="auth-tab" id="registerTab">注册</button>
    </div>

    <form id="loginForm" class="auth-form active">
      <label for="loginUsername">用户名</label>
      <input type="text" id="loginUsername" autocomplete="username" />
      <label for="loginPassword">密码</label>
      <input type="password" id="loginPassword" autocomplete="current-password" />
      <button type="submit" class="auth-submit">登录</button>
    </form>

    <form id="registerForm" class="auth-form">
      <label for="registerUsername">用户名</label>
      <input type="text" id="registerUsername" autocomplete="username" />
      <label for="registerNickname">昵称（可选）</label>
      <input type="text" id="registerNickname" autocomplete="nickname" />
      <label for="registerPassword">密码</label>
      <input type="password" id="registerPassword" autocomplete="new-password" />
      <label for="registerPasswordConfirm">确认密码</label>
      <input type="password" id="registerPasswordConfirm" autocomplete="new-password" />
      <button type="submit" class="auth-submit">注册</button>
    </form>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const AUTH_TABS = {
    login: { tab: "loginTab", form: "loginForm" },
    register: { tab: "registerTab", form: "registerForm" },
  };

  function switchAuthTab(activeKey) {
    const active = AUTH_TABS[activeKey];
    const other = AUTH_TABS[activeKey === "login" ? "register" : "login"];
    document.getElementById(active.tab).classList.add("active");
    document.getElementById(other.tab).classList.remove("active");
    document.getElementById(active.form).classList.add("active");
    document.getElementById(other.form).classList.remove("active");
  }

  function getInputValue(id) {
    return document.getElementById(id).value.trim();
  }

  function validateAuthForm(kind) {
    const username =
      kind === "login"
        ? getInputValue("loginUsername")
        : getInputValue("registerUsername");
    const password =
      kind === "login"
        ? getInputValue("loginPassword")
        : getInputValue("registerPassword");
    if (!username) {
      showNotification("请输入用户名", "warning");
      return false;
    }
    if (password.length < 6) {
      showNotification("密码至少 6 位", "warning");
      return false;
    }
    if (kind === "register") {
      const confirmPassword = getInputValue("registerPasswordConfirm");
      if (password !== confirmPassword) {
        showNotification("两次输入的密码不一致", "warning");
        return false;
      }
    }
    return true;
  }

  async function submitAuth(kind) {
    if (!validateAuthForm(kind)) {
      return;
    }
    const isLogin = kind === "login";
    const payload = {
      username: isLogin
        ? getInputValue("loginUsername")
        : getInputValue("registerUsername"),
      password: isLogin
        ? getInputValue("loginPassword")
        : getInputValue("registerPassword"),
    };
    if (!isLogin) {
      const nickname = getInputValue("registerNickname");
      if (nickname) {
        payload.display_name = nickname;
      }
    }
    const endpoint = isLogin ? "/api/auth/login" : "/api/auth/register";
    const successMessage = isLogin ? "登录成功" : "注册成功";
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) {
        showNotification(data.message || "操作失败", "error");
        return;
      }
      showNotification(successMessage, "success");
      setTimeout(() => {
        window.location.href = "/me";
      }, 1000);
    } catch (error) {
      showNotification("请求失败，请稍后重试", "error");
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    document
      .getElementById("loginTab")
      .addEventListener("click", () => switchAuthTab("login"));
    document
      .getElementById("registerTab")
      .addEventListener("click", () => switchAuthTab("register"));
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      submitAuth("login");
    });
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      submitAuth("register");
    });
  });
</script>
{% endblock %}
